                // --- MUSIC STATE MACHINE ---
                let target_music = current_music_state;
                if (app_state === "MENU") {
                    target_music = "MENU";
                } else if ((app_state === "GAME" || app_state === "OFFLINE_GAME") && !gamestate.started) {
                    target_music = "LOBBY";
                } else if ((app_state === "GAME" || app_state === "OFFLINE_GAME") && gamestate.started) {
                    target_music = "GAME";
                } else if (app_state === "HIGHLIGHTS") {
                    target_music = "LOBBY";
                }

                if (current_music_state !== target_music) {
                    current_music_state = target_music;
                    try {
                        if (target_music === "MENU") bg_music_player.src = menu_music;
                        else if (target_music === "LOBBY") bg_music_player.src = lobby_music;
                        else if (target_music === "GAME") bg_music_player.src = game_music;
                        bg_music_player.play().catch(() => {});
                    } catch (e) {}
                }

                // --- PREVENT GHOST SHAKES ON GAME ENTRY ---
                if (app_state === "MENU" || app_state === "CONNECTING") {
                    last_alive_players = {};
                    last_projectiles = [];
                    recent_hits = {};
                    last_out_of_bounds.clear();
                    last_projectile_count = 0;
                    screen_shake = 0;
                }

                // --- SHOOT SOUND TRACKER, RING-OUTS & ELIMINATION FOCUS ---
                let raw_projs = gamestate.projectiles || [];
                let current_projs = raw_projs.length;
                let current_alive_players = {};
                for (let p of (gamestate.players || [])) {
                    if (p.alive) current_alive_players[p.id] = p;
                }
                let ring_r = gamestate.ring !== undefined ? gamestate.ring : 2000;

                // 1. Assign an "Owner" to every projectile client-side
                let current_proj_list = [];
                for (let c_pr of raw_projs) {
                    let owner_id = null;
                    for (let old_p of last_projectiles) {
                        if (Math.hypot(c_pr[0] - old_p[0], c_pr[1] - old_p[1]) < 50) {
                            owner_id = old_p[3];
                            break;
                        }
                    }
                    if (owner_id === null) {
                        let min_dist = Infinity;
                        for (let [pid, p] of Object.entries(current_alive_players)) {
                            let dist = Math.hypot(c_pr[0] - p.x, c_pr[1] - p.y);
                            if (dist < min_dist) {
                                min_dist = dist;
                                owner_id = p.id;
                            }
                        }
                    }
                    current_proj_list.push([c_pr[0], c_pr[1], c_pr[2], owner_id]);
                }

                if (current_projs > last_projectile_count && shoot_sound) {
                    shoot_sound.play();
                }

                // 2. Check for on-screen projectile impacts & log recent hits
                let missing_projectiles = [];
                if (current_projs < last_projectile_count) {
                    for (let old_p of last_projectiles) {
                        let is_missing = true;
                        for (let curr_p of current_proj_list) {
                            if (Math.hypot(old_p[0] - curr_p[0], old_p[1] - curr_p[1]) < 50) {
                                is_missing = false;
                                break;
                            }
                        }
                        if (is_missing) {
                            missing_projectiles.push(old_p);
                            let sx = Math.trunc((old_p[0] - target_x) * zoom + WIDTH / 2);
                            let sy = Math.trunc((old_p[1] - target_y) * zoom + HEIGHT / 2);
                            if (sx >= -100 && sx <= WIDTH + 100 && sy >= -100 && sy <= HEIGHT + 100) {
                                screen_shake = Math.min(20, screen_shake + 12);
                            }
                        }
                    }
                }

                let current_out_of_bounds = new Set();
                for (let [c_pid_str, c_p] of Object.entries(current_alive_players)) {
                    let c_pid = c_p.id;
                    // A) Did a missing projectile just hit this player?
                    for (let m_proj of missing_projectiles) {
                        let dist_to_player = Math.hypot(m_proj[0] - c_p.x, m_proj[1] - c_p.y);
                        if (dist_to_player < c_p.size + m_proj[2] + 30) {
                            recent_hits[c_pid] = { shooter: m_proj[3], time: now };
                        }
                    }

                    // B) Ring-Out tracking
                    if (Math.hypot(c_p.x, c_p.y) > ring_r) {
                        current_out_of_bounds.add(c_pid);
                        if (!last_out_of_bounds.has(c_pid)) {
                            let hit = recent_hits[c_pid];
                            if (hit && (now - hit.time) < 3000) {
                                highlight_events.push({ killer: hit.shooter, timestamp: now });
                            }
                        }
                    }
                }
                last_out_of_bounds = current_out_of_bounds;

                // 3. Check for player eliminations (Eating OR Shooting)
                for (let [pid_str, old_p] of Object.entries(last_alive_players)) {
                    let pid = old_p.id;
                    if (!(pid in current_alive_players)) {
                        let sx = Math.trunc((old_p.x - target_x) * zoom + WIDTH / 2);
                        let sy = Math.trunc((old_p.y - target_y) * zoom + HEIGHT / 2);
                        if (sx >= -100 && sx <= WIDTH + 100 && sy >= -100 && sy <= HEIGHT + 100) {
                            screen_shake = Math.min(30, screen_shake + 20);
                        }

                        let killer_id = null;
                        let hit = recent_hits[pid];
                        if (hit && (now - hit.time) < 1000) {
                            killer_id = hit.shooter;
                        }

                        if (killer_id === null) {
                            let min_dist = Infinity;
                            for (let [c_pid_str, c_p] of Object.entries(current_alive_players)) {
                                let dist = Math.hypot(old_p.x - c_p.x, old_p.y - c_p.y);
                                if (dist < min_dist) {
                                    min_dist = dist;
                                    killer_id = c_p.id;
                                }
                            }
                        }

                        if (killer_id !== null) {
                            highlight_events.push({ killer: killer_id, timestamp: now });
                        }
                    }
                }

                last_projectile_count = current_projs;
                last_projectiles = current_proj_list;
                last_alive_players = current_alive_players;

                // --- RECORD GAME HISTORY ---
                if (gamestate && gamestate.started && ["GAME", "OFFLINE_GAME", "WINNER"].includes(app_state)) {
                    // Prevent memory spikes by capping the history array to the last 4 minutes (14,400 frames at 60fps)
                    if (game_history.length > 14400) {
                        game_history.shift(); 
                    }
                    
                    // MEMORY FIX: We use a fast shallow copy (.slice) instead of an expensive deep copy (.map). 
                    // This prevents the browser from generating 60,000 tiny arrays per second, completely eliminating the lag!
                    let frame = {
                        players: gamestate.players || [],
                        projectiles: current_proj_list || [],
                        particles: gamestate.particles ? gamestate.particles.slice() : [],
                        ring: gamestate.ring !== undefined ? gamestate.ring : 2000,
                        started: true
                    };
                    game_history.push([now, frame]);
                }

                now = get_ticks();

                let can_shoot = false;
                let me = (gamestate.players || []).find(p => p.id === my_id) || null;
                if (me && me.alive && gamestate.started) {
                    if ((me.size - (me.size / 8)) >= START_SIZE) {
                        if ((now - last_shoot_time) >= 10000) {
                            can_shoot = true;
                        }
                    }
                }

                // Process Queued Events
                while (event_queue.length > 0) {
                    let event = event_queue.shift();

                    if (event.type === "FINGERDOWN") {
                        let pos = [event.x * WIDTH, event.y * HEIGHT];
                        active_touches[event.finger_id] = { start: pos, current: pos };
                    } else if (event.type === "FINGERMOTION") {
                        if (event.finger_id in active_touches) {
                            active_touches[event.finger_id].current = [event.x * WIDTH, event.y * HEIGHT];
                        }
                    } else if (event.type === "FINGERUP") {
                        delete active_touches[event.finger_id];
                    }

                    let ui_click_pos = null;
                    if (event.type === "MOUSEBUTTONDOWN" && event.button === 1) {
                        ui_click_pos = event.pos;
                        mouse_active = true;
                        mouse_start = event.pos;
                    } else if (event.type === "MOUSEBUTTONUP" && event.button === 1) {
                        mouse_active = false;
                    } else if (event.type === "FINGERDOWN") {
                        ui_click_pos = [event.x * WIDTH, event.y * HEIGHT];
                    }

                    if (ui_click_pos) {
                        if (bg_music_player.paused) {
                            bg_music_player.play().catch(() => {});
                        }

                        if (app_state === "MENU") {
                            let [play_rect, offline_rect] = draw_menu();
                            if (play_rect && play_rect.collidepoint(ui_click_pos)) {
                                app_state = "CONNECTING";
                                connect_to_server();
                            } else if (offline_rect && offline_rect.collidepoint(ui_click_pos)) {
                                app_state = "OFFLINE_GAME";
                                offline_engine = new OfflineEngine();
                                my_id = 0;
                            }
                        } else if (app_state === "CONNECTING" && BACK_BTN_RECT.collidepoint(ui_click_pos)) {
                            app_state = "MENU";
                            server_status = "OK";
                            try {
                                if (client) client.close();
                            } catch (e) {}
                        } else if ((app_state === "HIGHLIGHTS" || app_state === "WINNER_FINAL") && BACK_BTN_RECT.collidepoint(ui_click_pos)) {
                            app_state = "MENU";
                            gamestate = {};
                            game_history = [];
                            highlight_events = [];
                            visual_players = {};
                            msg_queue = [];
                        } else if (app_state === "GAME" || app_state === "OFFLINE_GAME") {
                            if (MODE_BTN_RECT.collidepoint(ui_click_pos)) {
                                if (display_mode === "DEFAULT") {
                                    display_mode = "TEXTURES";
                                    use_textures = true;
                                } else if (display_mode === "TEXTURES") {
                                    display_mode = "3D";
                                    use_textures = false;
                                    document.documentElement.style.setProperty('--canvas3d-display', 'block');
                                    document.documentElement.style.setProperty('--canvas2d-bg', 'transparent');
                                } else if (display_mode === "3D") {
                                    display_mode = "DEFAULT";
                                    use_textures = false;
                                    document.documentElement.style.setProperty('--canvas3d-display', 'none');
                                    document.documentElement.style.setProperty('--canvas2d-bg', 'rgb(200, 240, 255)');
                                }
                            } else if ((app_state === "OFFLINE_GAME" || !gamestate.started) && BACK_BTN_RECT.collidepoint(ui_click_pos)) {
                                app_state = "MENU";
                                gamestate = {};
                                game_history = [];
                                highlight_events = [];
                                visual_players = {};
                                msg_queue = [];
                                try {
                                    if (client) client.close();
                                } catch (e) {}
                            } else if (!gamestate.started && app_state === "GAME") {
                                let human_players = (gamestate.players || []).filter(p => !p.is_bot);
                                if (human_players.length >= 2) {
                                    let btn_ready = makeRect(WIDTH / 2 - 110, HEIGHT / 2 - 30, 220, 60);
                                    if (btn_ready.collidepoint(ui_click_pos)) {
                                        send({ command: "ready" });
                                    }
                                }
                            }
                        }
                    }

                    if (event.type === "KEYDOWN" && event.key === "K_SPACE") {
                        if (!gamestate.started && app_state === "GAME") {
                            let human_players = (gamestate.players || []).filter(p => !p.is_bot);
                            if (human_players.length >= 2) {
                                send({ command: "ready" });
                            }
                        }
                    }
                }

                // Evaluate Active Touch/Mouse Inputs for Dual Joysticks
                let current_inputs = Object.values(active_touches);
                if (mouse_active && Object.keys(active_touches).length === 0) {
                    current_inputs.push({ start: mouse_start, current: mouse_pos });
                }

                let move_active = false;
                let aim_active = false;
                let move_angle = last_angle;
                let aim_angle = last_aim_angle;
                let move_pos = [0, 0];
                let aim_pos = [0, 0];
                let pending_pu_command = null;

                if (gamestate.started && me && me.alive) {
                    for (let touch of current_inputs) {
                        let [sx, sy] = touch.start;
                        let [cx, cy] = touch.current;

                        // Left Joystick
                        if (Math.hypot(sx - MOVE_JOY_CENTER[0], sy - MOVE_JOY_CENTER[1]) <= JOY_RADIUS * 2.5) {
                            move_active = true;
                            move_pos = [cx, cy];
                            move_angle = Math.atan2(cy - MOVE_JOY_CENTER[1], cx - MOVE_JOY_CENTER[0]);
                        }
                        // Right Joystick
                        else if (can_shoot && Math.hypot(sx - AIM_JOY_CENTER[0], sy - AIM_JOY_CENTER[1]) <= JOY_RADIUS * 2.5) {
                            aim_active = true;
                            aim_pos = [cx, cy];
                            aim_angle = Math.atan2(cy - AIM_JOY_CENTER[1], cx - AIM_JOY_CENTER[0]);
                        }
                    }

                    // --- PC KEYBOARD & MOUSE OVERRIDES ---
                    let kb_dx = 0, kb_dy = 0;
                    if (keys_pressed["KeyW"] || keys_pressed["ArrowUp"]) kb_dy -= 1;
                    if (keys_pressed["KeyS"] || keys_pressed["ArrowDown"]) kb_dy += 1;
                    if (keys_pressed["KeyA"] || keys_pressed["ArrowLeft"]) kb_dx -= 1;
                    if (keys_pressed["KeyD"] || keys_pressed["ArrowRight"]) kb_dx += 1;

                    if (kb_dx !== 0 || kb_dy !== 0) {
                        move_active = true;
                        move_angle = Math.atan2(kb_dy, kb_dx);
                    }

                    let is_using_right_joystick = aim_active;
                    if (!is_using_right_joystick && mouse_focused) {
                        let [mx, my] = mouse_pos;

                        let left_click_shoot = false;
                        if (mouse_active && Object.keys(active_touches).length === 0) {
                            let dist_to_move_joy = Math.hypot(mouse_start[0] - MOVE_JOY_CENTER[0], mouse_start[1] - MOVE_JOY_CENTER[1]);
                            let clicked_ui = BACK_BTN_RECT.collidepoint(mouse_start) || MODE_BTN_RECT.collidepoint(mouse_start);

                            if (dist_to_move_joy > JOY_RADIUS * 2.5 && !clicked_ui) {
                                left_click_shoot = true;
                            }
                        }

                        if (can_shoot && (keys_pressed["Space"] || mouse_buttons[2] || left_click_shoot)) {
                            aim_active = true;
                            aim_angle = Math.atan2(my - HEIGHT / 2, mx - WIDTH / 2);
                        } else if (Object.keys(active_touches).length === 0) {
                            aim_angle = Math.atan2(my - HEIGHT / 2, mx - WIDTH / 2);
                        }
                    }
                }

                // State Execution & Rendering
                if (app_state === "MENU") {
                    draw_menu();
                } else if (app_state === "CONNECTING") {
                    draw_connecting();
                } else if (app_state === "WINNER") {
                    draw_game(false, 0, [0, 0], false, 0, [0, 0], false, dt);
                    draw_winner();
                    if (now - winner_display_start > 3000) {
                        if (highlight_events.length > 0 && game_history.length > 0) {
                            app_state = "HIGHLIGHTS";
                            highlight_clips = [];

                            highlight_events.sort((a, b) => a.timestamp - b.timestamp);

                            for (let ev of highlight_events) {
                                let pre_roll = 2500;
                                let post_roll = 1500;
                                let start_time = ev.timestamp - pre_roll;
                                let end_time = ev.timestamp + post_roll;

                                if (highlight_clips.length === 0) {
                                    highlight_clips.push({ start: start_time, end: end_time, focus: ev.killer });
                                } else {
                                    let last_clip = highlight_clips[highlight_clips.length - 1];
                                    if (start_time <= last_clip.end + 1000) {
                                        last_clip.end = Math.max(last_clip.end, end_time);
                                        last_clip.focus = ev.killer;
                                    } else {
                                        highlight_clips.push({ start: start_time, end: end_time, focus: ev.killer });
                                    }
                                }
                            }

                            if (highlight_clips.length > 0 && highlight_events.length > 0) {
                                highlight_clips[highlight_clips.length - 1].end = highlight_events[highlight_events.length - 1].timestamp + 800;
                            }

                            current_clip_idx = 0;
                            playback_timer = highlight_clips[0].start;
                        } else {
                            app_state = "MENU";
                            gamestate = {};
                            game_history = [];
                            highlight_events = [];
                            visual_players = {};
                            msg_queue = [];
                        }
                    }
                } else if (app_state === "HIGHLIGHTS") {
                    playback_timer += raw_ms;
                    let current_clip = highlight_clips[current_clip_idx];

                    let switched_to_final = false;
                    if (playback_timer > current_clip.end) {
                        current_clip_idx += 1;
                        if (current_clip_idx >= highlight_clips.length) {
                            app_state = "WINNER_FINAL";
                            winner_display_start = get_ticks();
                            switched_to_final = true;
                        } else {
                            current_clip = highlight_clips[current_clip_idx];
                            playback_timer = current_clip.start;
                        }
                    }

                    if (!switched_to_final) {
                        let best_frame = game_history[0][1];
                        for (let [t, frame] of game_history) {
                            if (t > playback_timer) break;
                            best_frame = frame;
                        }
                        gamestate = best_frame;

                        let original_my_id = my_id;
                        my_id = current_clip.focus;
                        draw_game(false, 0, [0, 0], false, 0, [0, 0], false, dt);
                        my_id = original_my_id;

                        ctx.save();
                        ctx.font = "bold 40px Arial";
                        ctx.fillStyle = BLACK;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "top";
                        ctx.fillText("HIGHLIGHT REEL", WIDTH / 2, 80);
                        ctx.restore();

                        fillRoundRect(BACK_BTN_RECT, "rgb(200, 50, 50)", 5);
                        ctx.save();
                        ctx.font = "bold 16px Arial";
                        ctx.fillStyle = WHITE;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText("SKIP", BACK_BTN_RECT.centerx, BACK_BTN_RECT.centery);
                        ctx.restore();
                    }
                } else if (app_state === "WINNER_FINAL") {
                    draw_game(false, 0, [0, 0], false, 0, [0, 0], false, dt);
                    draw_winner();

                    if (now - winner_display_start > 3000) {
                        app_state = "MENU";
                        gamestate = {};
                        game_history = [];
                        highlight_events = [];
                        visual_players = {};
                        msg_queue = [];
                    }
                } else if (app_state === "OFFLINE_GAME" || app_state === "GAME") {
                    if (last_is_aiming && !aim_active) {
                        if (app_state === "GAME") {
                            send({ command: "shoot", angle: last_aim_angle });
                            send({ command: "move", is_aiming: false, moving: move_active, angle: move_angle });
                        } else {
                            pending_shoot_command = true;
                        }
                        last_shoot_time = now;
                    }

                    if (app_state === "GAME") {
                        let state_changed = false;
                        if (move_active !== last_moving || (move_active && Math.abs(move_angle - last_angle) > 0.01)) {
                            state_changed = true;
                        }
                        if (aim_active !== last_is_aiming || (aim_active && Math.abs(aim_angle - last_aim_angle) > 0.01)) {
                            state_changed = true;
                        }

                        if (state_changed) {
                            send({
                                command: "move",
                                angle: move_angle,
                                moving: move_active,
                                is_aiming: aim_active,
                                aim_angle: aim_angle
                            });
                        }
                    }

                    last_angle = move_angle;
                    last_moving = move_active;
                    last_aim_angle = aim_angle;
                    last_is_aiming = aim_active;

                    if (app_state === "OFFLINE_GAME") {
                        gamestate = offline_engine.update(move_active, move_angle, aim_active, aim_angle, pending_shoot_command, pending_pu_command);
                        pending_shoot_command = false;
                        pending_pu_command = null;

                        let alive_players = gamestate.players.filter(p => p.alive);
                        if (alive_players.length <= 1) {
                            let winner_name = alive_players.length > 0 ? alive_players[0].name : "Nobody";
                            winner_announcement = `${winner_name} Wins!`;
                            winner_display_start = get_ticks();
                            app_state = "WINNER";
                        }
                    }

                    draw_game(move_active, move_angle, move_pos, aim_active, aim_angle, aim_pos, can_shoot, dt);
                }

                requestAnimationFrame(step);
            }

            requestAnimationFrame(step);
        }

        main();
    </script>
</body>
</html>
