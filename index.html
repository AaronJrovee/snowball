<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snowball.io</title>
    
    <!-- App Icon and Manifest Links -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* CSS variables to control visibility cleanly */
        :root {
            --canvas3d-display: none;
            --canvas2d-bg: rgb(200, 240, 255);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            /* These calculations lock the aspect ratio to exactly 800x600 */
            max-width: calc(100vh * (800 / 600));
            max-height: calc(100vw * (600 / 800));
            display: block;
            position: absolute;
        }
        #canvas3d { 
            z-index: 1; 
            background-color: rgb(135, 206, 235);
            display: var(--canvas3d-display);
        }
        #screen { 
            z-index: 2; 
            pointer-events: auto; 
            background-color: var(--canvas2d-bg);
        }
    </style>
    <!-- Include Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas3d"></canvas>
    <canvas id="screen" width="800" height="600"></canvas>
    <script>
        // ==============================================================================
        // SETTINGS.PY (1:1 Exact Mirror)
        // ==============================================================================
        const HOST = "snowball-server-ywri.onrender.com";
        const PORT = 5555;
        const BUFSIZE = 4096;
        const WIDTH = 800;
        const HEIGHT = 600;
        const MAP_SIZE = 2000;
        const FPS = 60;
        const START_SIZE = 20;
        const MAX_PARTICLES = 1000;
        const RING_SHRINK_RATE = 0.20833;
        const STUN_MULTIPLIER = 20;

        // Colors
        const WHITE = "rgb(255, 255, 255)";
        const BLACK = "rgb(0, 0, 0)";
        const RED = "rgb(255, 0, 0)";
        const ORANGE = "rgb(255, 165, 0)";
        const BG_COLOR = [200, 240, 255];
        const BG_COLOR_STR = "rgb(200, 240, 255)";
        const YELLOWISH_WHITE = "rgb(255, 255, 220)";

        // ==============================================================================
        // INITIALIZATION & ASSET LOADING
        // ==============================================================================
        const canvas = document.getElementById("screen");
        const ctx = canvas.getContext("2d");

        const start_ticks = performance.now();
        function get_ticks() {
            return Math.floor(performance.now() - start_ticks);
        }

        function randUniform(min, max) {
            return Math.random() * (max - min) + min;
        }
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        function randChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
        function pyMod(n, m) {
            return ((n % m) + m) % m;
        }

        // --- IMAGE ASSET LOADING ---
        let snow_sprite = null;
        const _snowImg1 = new Image();
        _snowImg1.onload = () => { snow_sprite = _snowImg1; };
        _snowImg1.onerror = () => {
            const _snowImg2 = new Image();
            _snowImg2.onload = () => { snow_sprite = _snowImg2; };
            _snowImg2.src = "snowball.jpg";
        };
        _snowImg1.src = "snowball.png";

        let bg_sprite = null;
        const _bgImg = new Image();
        _bgImg.onload = () => { bg_sprite = _bgImg; };
        _bgImg.src = "ice_bg.png";

        // --- SOUND ASSET LOADING ---
        const menu_music = "menu.ogg";
        const lobby_music = "lobby.ogg";
        const game_music = "game.ogg";
        let bg_music_player = new Audio();
        bg_music_player.loop = true;

        function loadSound(src) {
            const audio = new Audio(src);
            return {
                play: function() {
                    try {
                        const clone = audio.cloneNode();
                        clone.play().catch(() => {});
                    } catch (e) {}
                }
            };
        }
        let shoot_sound = loadSound("shoot.ogg");
        let capture_sound = loadSound("capture.ogg");
        let collect_sound = loadSound("collect.ogg");
        
        let last_collect_time = 0; // Tracks audio throttling

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 500, 3000);

        const camera = new THREE.PerspectiveCamera(60, WIDTH / HEIGHT, 1, 10000);
        const canvas3d = document.getElementById("canvas3d");
        const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: true });
        renderer.setSize(WIDTH, HEIGHT, false);
        renderer.shadowMap.enabled = true;

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dLight.position.set(1000, 2000, 1000);
        dLight.castShadow = true;
        dLight.shadow.camera.left = -3000;
        dLight.shadow.camera.right = 3000;
        dLight.shadow.camera.top = 3000;
        dLight.shadow.camera.bottom = -3000;
        scene.add(dLight);

        // Make the ground more originally blue
        const groundGeo = new THREE.PlaneGeometry(10000, 10000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x87CEEB }); 
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.rotation.x = -Math.PI/2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const ringGeo = new THREE.TorusGeometry(2000, 20, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI/2;
        ringMesh.position.y = 5;
        scene.add(ringMesh);

        const partGeo = new THREE.SphereGeometry(1, 8, 8);
        const partMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const partInstanced = new THREE.InstancedMesh(partGeo, partMat, 2000);
        partInstanced.castShadow = true;
        scene.add(partInstanced);
        
        const projGeo = new THREE.SphereGeometry(1, 16, 16);
        const projMat = new THREE.MeshLambertMaterial({ color: 0xddddff });
        const projInstanced = new THREE.InstancedMesh(projGeo, projMat, 200);
        projInstanced.castShadow = true;
        scene.add(projInstanced);

        const aimRayGeo = new THREE.PlaneGeometry(1, 1);
        aimRayGeo.translate(0.5, 0, 0); // Origin at left edge
        const aimRayMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false });
        const aimRayMesh = new THREE.Mesh(aimRayGeo, aimRayMat);
        aimRayMesh.rotation.order = "YXZ";
        aimRayMesh.visible = false;
        scene.add(aimRayMesh);

        let playerMeshes = {};

        function project3D(x, y, z) {
            let vec = new THREE.Vector3(x, y, z);
            vec.project(camera);
            if (vec.z > 1) return null; // Behind camera
            return [
                (vec.x * 0.5 + 0.5) * WIDTH,
                (-vec.y * 0.5 + 0.5) * HEIGHT
            ];
        }


        // --- GLOBAL VARIABLES ---
        let app_state = "MENU";
        let server_status = "OK";
        let client = null;
        let my_id = null;
        let gamestate = {};
        let visual_players = {};
        let winner_announcement = "";
        let winner_display_start = 0;

        let msg_queue = [];
        let screen_shake = 0;
        let target_x = 0, target_y = 0;
        let zoom = 1.0;

        // Highlights Variables
        let game_history = [];
        let highlight_events = [];
        let highlight_clips = [];
        let current_clip_idx = 0;
        let playback_timer = 0;

        // Menu Animation Variables
        let menu_snowball = { x: -100, y: 50, angle: 0, size: 60, vx: 4, vy: 1.5 };
        let menu_snowflakes = [];
        for (let i = 0; i < 100; i++) {
            menu_snowflakes.push([
                randInt(0, WIDTH),
                randInt(0, HEIGHT),
                randUniform(1, 4),
                randUniform(1, 3)
            ]);
        }

        // Joystick & UI Configuration
        const AIM_JOY_CENTER = [WIDTH - 120, HEIGHT - 120];
        const MOVE_JOY_CENTER = [120, HEIGHT - 120];
        const JOY_RADIUS = 70;

        function makeRect(x, y, w, h) {
            return {
                x: x, y: y, width: w, height: h,
                centerx: x + w / 2, centery: y + h / 2,
                collidepoint: function(px, py) {
                    if (Array.isArray(px)) { py = px[1]; px = px[0]; }
                    return px >= this.x && px <= this.x + this.width && py >= this.y && py <= this.y + this.height;
                }
            };
        }

        const MODE_BTN_RECT = makeRect(WIDTH - 245, 15, 155, 35);
        const BACK_BTN_RECT = makeRect(WIDTH - 80, 15, 65, 30);

        let display_mode = "DEFAULT"; // DEFAULT, TEXTURES, 3D
        let use_textures = false; // Kept for backwards compatibility with logic
        let offline_engine = null;

        // ==============================================================================
        // OFFLINE ENGINE (1:1 Exact Server Mirror)
        // ==============================================================================
        const PREFIXES = ["Cool", "Frozen", "Ice", "Snow", "Brawl", "Rolling", "Winter", "Cold", "Awesome", "Amazing", "Throwing", "Super", "New"];
        const SUFFIXES = ["Master", "Expert", "Addict", "Sphere", "Gamer", "Gobbler", "Dude"];

        class OfflineEngine {
            constructor() {
                this.ring = MAP_SIZE * 1.5;
                this.particles = [];
                for (let i = 0; i < MAX_PARTICLES; i++) {
                    let a = randUniform(0, Math.PI * 2);
                    let r = Math.sqrt(randUniform(0, 1)) * this.ring;
                    this.particles.push([r * Math.cos(a), r * Math.sin(a), 5]);
                }

                this.projectiles = [];
                this.players = [];

                let existing_names = new Set();
                function get_name(p_id) {
                    for (let i = 0; i < 100; i++) {
                        let n = `${randChoice(PREFIXES)}${randChoice(SUFFIXES)}`;
                        if (!existing_names.has(n)) {
                            existing_names.add(n);
                            return n;
                        }
                    }
                    return `Player${p_id}`;
                }

                // Human Player
                this.players.push({
                    id: 0, x: 0, y: 0, size: START_SIZE, target_size: START_SIZE, angle: 0, alive: true,
                    name: get_name(0), is_aiming: false, aim_angle: 0, kb_dx: 0, kb_dy: 0, vx: 0, vy: 0,
                    last_shoot: 0, is_moving: false, is_bot: false, stun_timer: 0
                });

                // Bots
                for (let i = 1; i < 10; i++) {
                    let a = randUniform(0, Math.PI * 2);
                    let r = Math.sqrt(randUniform(0, 1)) * (this.ring * 0.8);
                    this.players.push({
                        id: i, x: r * Math.cos(a), y: r * Math.sin(a), size: START_SIZE, target_size: START_SIZE,
                        angle: 0, alive: true, name: get_name(i) + " [BOT]", is_aiming: false,
                        aim_angle: 0, kb_dx: 0, kb_dy: 0, vx: 0, vy: 0, last_shoot: 0, is_moving: true,
                        is_bot: true, stun_timer: 0
                    });
                }
            }

            spawn_burst(x, y, total_value, radius) {
                let num = Math.max(1, Math.floor(total_value / 5));
                for (let i = 0; i < num; i++) {
                    let a = randUniform(0, Math.PI * 2);
                    let r = randUniform(0, radius);
                    this.particles.push([x + Math.cos(a) * r, y + Math.sin(a) * r, 5]);
                }
            }

            update(moving, angle, aiming, aim_angle, shoot, use_pu = null) {
                let me = this.players[0];
                let now_sec = performance.now() / 1000.0;
                if (me.alive) {
                    me.is_moving = moving;
                    me.angle = angle;
                    me.is_aiming = aiming;
                    me.aim_angle = aim_angle;

                    if (shoot && me.stun_timer <= 0 && (now_sec - me.last_shoot) >= 10 && (me.size - (me.size / 8)) >= START_SIZE) {
                        me.last_shoot = now_sec;
                        let cost = me.size / 8;
                        me.size -= cost;
                        me.target_size -= cost;
                        let psize = (me.size + cost) / 4;
                        let dist = me.size + psize + 5;
                        let speed = 10 + (psize * 0.2);
                        let life = Math.floor(40 + psize);
                        // format: x, y, size, angle, owner_id, life, speed
                        this.projectiles.push([
                            me.x + Math.cos(aim_angle) * dist,
                            me.y + Math.sin(aim_angle) * dist,
                            psize, aim_angle, 0, life, speed
                        ]);
                    }
                }

                // Exact server Bot AI
                for (let p of this.players) {
                    if (p.is_bot && p.alive) {
                        let closest_p = null;
                        let min_p_dist = Infinity;
                        for (let other_p of this.players) {
                            if (other_p.id !== p.id && other_p.alive) {
                                let dist = Math.hypot(p.x - other_p.x, p.y - other_p.y);
                                if (dist < min_p_dist) {
                                    min_p_dist = dist;
                                    closest_p = other_p;
                                }
                            }
                        }

                        let action_taken = false;
                        let target_angle = p.angle;
                        if (closest_p) {
                            if (p.size >= closest_p.size * 1.25) {
                                target_angle = Math.atan2(closest_p.y - p.y, closest_p.x - p.x);
                                action_taken = true;
                            } else if (closest_p.size >= p.size * 1.25) {
                                target_angle = Math.atan2(p.y - closest_p.y, p.x - closest_p.x);
                                action_taken = true;
                            }
                        }

                        if (!action_taken && this.particles.length > 0) {
                            let closest_part = null;
                            let min_part_dist = Infinity;
                            for (let part of this.particles) {
                                let dist = Math.hypot(p.x - part[0], p.y - part[1]);
                                if (dist < min_part_dist) {
                                    min_part_dist = dist;
                                    closest_part = part;
                                }
                            }
                            if (closest_part) {
                                target_angle = Math.atan2(closest_part[1] - p.y, closest_part[0] - p.x);
                            }
                        }

                        let dist_to_center = Math.hypot(p.x, p.y);
                        if (dist_to_center > this.ring - p.size - 30) {
                            target_angle = Math.atan2(-p.y, -p.x);
                        }

                        if (Math.random() < 0.05) {
                            target_angle += randUniform(-0.5, 0.5);
                        }

                        let diff = pyMod(target_angle - p.angle + Math.PI, 2 * Math.PI) - Math.PI;
                        p.angle += Math.max(-0.08, Math.min(0.08, diff));
                    }
                }

                // Position updates
                for (let p of this.players) {
                    if (!p.alive) continue;

                    p.x += p.kb_dx;
                    p.y += p.kb_dy;
                    p.kb_dx *= 0.85;
                    p.kb_dy *= 0.85;

                    let active_vel = 5;
                    let tx = 0;
                    let ty = 0;

                    if (p.stun_timer > 0) {
                        p.stun_timer -= 1;
                    } else {
                        if (p.is_aiming) {
                            tx = Math.cos(p.aim_angle + Math.PI) * (active_vel * 0.5);
                            ty = Math.sin(p.aim_angle + Math.PI) * (active_vel * 0.5);
                        } else if (p.is_moving) {
                            tx = Math.cos(p.angle) * active_vel;
                            ty = Math.sin(p.angle) * active_vel;
                        }
                    }

                    // Acceleration scales with size
                    let accel = Math.max(0.02, START_SIZE / (p.size * 2.5));

                    p.vx += (tx - p.vx) * accel;
                    p.vy += (ty - p.vy) * accel;

                    p.x += p.vx;
                    p.y += p.vy;
                }

                this.ring = Math.max(0, this.ring - RING_SHRINK_RATE);

                // Projectile updates
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    let proj = this.projectiles[i];
                    proj[0] += Math.cos(proj[3]) * proj[6];
                    proj[1] += Math.sin(proj[3]) * proj[6];
                    proj[5] -= 1;
                    if (proj[5] <= 0) {
                        this.projectiles.splice(i, 1);
                        this.spawn_burst(proj[0], proj[1], proj[2], proj[2] / 2);
                    }
                }

                // Projectile-Projectile Collisions
                for (let i = 0; i < this.projectiles.length; i++) {
                    let p1 = this.projectiles[i];
                    if (p1[5] <= 0) continue;
                    for (let j = i + 1; j < this.projectiles.length; j++) {
                        let p2 = this.projectiles[j];
                        if (p2[5] <= 0) continue;
                        if (Math.hypot(p1[0] - p2[0], p1[1] - p2[1]) < p1[2] + p2[2]) {
                            if (p1[2] >= p2[2] * 1.25) {
                                p1[2] -= p2[2] * 0.25;
                                p2[5] = 0;
                                this.spawn_burst(p2[0], p2[1], p2[2], p2[2]);
                            } else if (p2[2] >= p1[2] * 1.25) {
                                p2[2] -= p1[2] * 0.25;
                                p1[5] = 0;
                                this.spawn_burst(p1[0], p1[1], p1[2], p1[2]);
                            } else {
                                p1[5] = 0;
                                p2[5] = 0;
                                this.spawn_burst(p1[0], p1[1], p1[2], p1[2]);
                                this.spawn_burst(p2[0], p2[1], p2[2], p2[2]);
                            }
                        }
                    }
                }

                // Player Collisions (Eating, Projectiles, Ring, Particles)
                for (let p of this.players) {
                    if (!p.alive) continue;

                    if (Math.hypot(p.x, p.y) > this.ring) {
                        p.size -= 0.5;
                        p.target_size = p.size;
                        if (p.size <= 5) p.alive = false;
                    }

                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        let part = this.particles[i];
                        if (Math.hypot(p.x - part[0], p.y - part[1]) < p.size + part[2]) {
                            p.target_size += part[2] * 0.1;
                            this.particles.splice(i, 1);
                        }
                    }

                    for (let proj of this.projectiles) {
                        if (proj[4] !== p.id && proj[5] > 0) {
                            if (Math.hypot(p.x - proj[0], p.y - proj[1]) < p.size + proj[2]) {
                                proj[5] = 0;
                                if (proj[2] > p.size) {
                                    p.alive = false;
                                    this.spawn_burst(p.x, p.y, p.size, p.size);
                                } else {
                                    let ratio = proj[2] / p.size;
                                    p.stun_timer = Math.min(120, Math.floor(ratio * 215));
                                    p.kb_dx = Math.cos(proj[3]) * (proj[2] * 6 * Math.max(0.1, ratio));
                                    p.kb_dy = Math.sin(proj[3]) * (proj[2] * 6 * Math.max(0.1, ratio));
                                }
                            }
                        }
                    }

                    for (let other_p of this.players) {
                        if (p.id !== other_p.id && other_p.alive) {
                            let dist = Math.hypot(p.x - other_p.x, p.y - other_p.y);
                            if (dist < p.size) {
                                if (p.size >= other_p.size * 1.25) {
                                    other_p.alive = false;
                                    p.target_size += other_p.size * 0.5;
                                    this.spawn_burst(other_p.x, other_p.y, other_p.size * 0.5, other_p.size);
                                }
                            }
                        }
                    }
                }

                // Particle ring-cull & respawn
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let part = this.particles[i];
                    if (Math.hypot(part[0], part[1]) > this.ring) {
                        this.particles.splice(i, 1);
                    }
                }

                while (this.particles.length < MAX_PARTICLES) {
                    let a = randUniform(0, Math.PI * 2);
                    let r = Math.sqrt(randUniform(0, 1)) * Math.max(1, this.ring);
                    this.particles.push([r * Math.cos(a), r * Math.sin(a), 5]);
                }

                // Smooth scaling
                for (let p of this.players) {
                    if (p.alive) {
                        if (p.size < p.target_size) {
                            p.size += (p.target_size - p.size) * 0.1;
                        } else if (p.size > p.target_size) {
                            p.size = p.target_size;
                        }
                    }
                }

                return {
                    players: this.players.map(p => ({ ...p })),
                    projectiles: this.projectiles.filter(pr => pr[5] > 0).map(pr => [Math.trunc(pr[0]), Math.trunc(pr[1]), Math.trunc(pr[2])]),
                    particles: this.particles.map(pt => [Math.trunc(pt[0]), Math.trunc(pt[1]), Math.trunc(pt[2])]),
                    ring: Math.trunc(this.ring),
                    started: true,
                    lobby_time: 0
                };
            }
        }

        // ==============================================================================
        // NETWORK & DRAWING
        // ==============================================================================
        function on_message(event) {
            msg_queue.push(String(event.data));
        }

        async function send(data) {
            if (client !== null) {
                try {
                    let msg = JSON.stringify(data);
                    if (client.readyState === 1) {
                        client.send(msg);
                    } else {
                        throw new Error("Socket not open");
                    }
                } catch (e) {
                    client = null;
                    server_status = "UNREACHABLE";
                    app_state = "MENU";
                }
            }
        }

        async function connect_to_server() {
            // --- CLIENT-SIDE BANDWIDTH CHECK ---
            try {
                const max_bytes = 4 * 1024 * 1024 * 1024;
                let is_capped = false;
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 3000);
                try {
                    let r = await fetch('https://snowball-server-d1dce-default-rtdb.firebaseio.com/bandwidth.json', { signal: controller.signal });
                    let d = await r.json();
                    let bw = d ? (d.bytes || 0) : 0;
                    if (bw >= max_bytes) is_capped = true;
                } catch (e) {
                    // Default to 0 on fetch error
                } finally {
                    clearTimeout(timeoutId);
                }

                if (is_capped) {
                    server_status = "CAPPED";
                    app_state = "MENU";
                    return;
                }
            } catch (e) {
                console.log("Pre-check failed, defaulting to server check:", e);
            }

            const url = HOST.includes("onrender.com") ? `wss://${HOST}` : `ws://${HOST}:${PORT}`;

            try {
                msg_queue = [];
                client = new WebSocket(url);
                client.onmessage = on_message;

                while (client && client.readyState === 0) {
                    if (app_state !== "CONNECTING") return;
                    await new Promise(r => setTimeout(r, 100));
                }

                if (!client || client.readyState !== 1) {
                    throw new Error("Server is offline or unreachable.");
                }

                let timeout = 0;
                while (msg_queue.length === 0) {
                    if (app_state !== "CONNECTING") return;
                    if (!client || client.readyState !== 1) {
                        throw new Error("Connection closed unexpectedly.");
                    }
                    await new Promise(r => setTimeout(r, 100));
                    timeout += 0.1;
                    if (timeout > 10) {
                        throw new Error("Timed out waiting for server response.");
                    }
                }

                let first_msg = String(msg_queue.shift());
                if (first_msg === "CAP_REACHED") {
                    server_status = "CAPPED";
                    app_state = "MENU";
                    if (client) client.close();
                    return;
                }
                my_id = parseInt(first_msg, 10);

                server_status = "OK";
                app_state = "GAME";
                receive_data();
            } catch (e) {
                console.log("Could not connect:", e);
                if (app_state === "CONNECTING") {
                    server_status = "UNREACHABLE";
                    try {
                        if (client) client.close();
                    } catch (err) {}
                    app_state = "MENU";
                }
            }
        }

        function process_payload(data) {
            try {
                let payload = JSON.parse(data);
                if (payload.command === "game_over") {
                    let winner_name = payload.winner_name || "Nobody";
                    winner_announcement = `${winner_name} Wins!`;
                    winner_display_start = get_ticks();
                    app_state = "WINNER";
                } else {
                    if ("particles" in payload) {
                        gamestate.particles = payload.particles;
                    }
                    
                    // Unpack the compressed array sent from the server back into objects
                    let unpacked_players = [];
                    if (payload.players) {
                        for (let p_data of payload.players) {
                            unpacked_players.push({
                                id: p_data[0],
                                x: p_data[1],
                                y: p_data[2],
                                size: p_data[3],
                                angle: p_data[4],
                                alive: p_data[5] === 1,
                                ready: p_data[6] === 1,
                                name: p_data[7],
                                is_aiming: p_data[8] === 1,
                                aim_angle: p_data[9],
                                is_bot: p_data[10] === 1,
                                stun_timer: p_data[11]
                            });
                        }
                    }
                    gamestate.players = unpacked_players;
                    
                    gamestate.projectiles = payload.projectiles || [];
                    gamestate.ring = payload.ring !== undefined ? payload.ring : 2000;
                    gamestate.started = payload.started || false;
                    gamestate.lobby_time = payload.lobby_time !== undefined ? payload.lobby_time : 60;
                }
            } catch (e) {
                console.log("Failed to parse payload:", e);
            }
        }

        async function receive_data() {
            while (app_state === "GAME" || app_state === "WINNER") {
                if (msg_queue.length > 0) {
                    let latest_msg = msg_queue[msg_queue.length - 1];
                    msg_queue = [];
                    try {
                        process_payload(latest_msg);
                    } catch (e) {}
                }
                await new Promise(r => setTimeout(r, 10));
            }
        }

        // --- DRAWING HELPERS ---
        function drawCircle(x, y, radius, color) {
            if (radius <= 0) return;
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function strokeCircle(x, y, radius, color, width) {
            if (radius <= 0) return;
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            ctx.restore();
        }

        function fillRoundRect(rect, color, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(rect.x, rect.y, rect.width, rect.height, radius);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function strokeRoundRect(rect, color, width, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(rect.x, rect.y, rect.width, rect.height, radius);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            ctx.restore();
        }

        function draw_menu() {
            if (display_mode === "3D") {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                renderer.render(scene, camera);
                camera.position.x = Math.cos(get_ticks() * 0.0005) * 1000;
                camera.position.z = Math.sin(get_ticks() * 0.0005) * 1000;
                camera.position.y = 1000;
                camera.lookAt(0, 0, 0);
            } else {
                // 1. Sky background
                ctx.fillStyle = "rgb(135, 206, 235)";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }

            if (display_mode !== "3D") {
                // 2. Update and draw menu snowflakes
                for (let flake of menu_snowflakes) {
                    flake[1] += flake[3]; // Move down
                    flake[0] += Math.sin(flake[1] * 0.05) * 0.5; // Sway
                    if (flake[1] > HEIGHT) {
                        flake[1] = randInt(-50, -10);
                        flake[0] = randInt(0, WIDTH);
                    }
                    drawCircle(Math.trunc(flake[0]), Math.trunc(flake[1]), Math.trunc(flake[2]), WHITE);
                }

                // 3. Draw a snow-covered hill
                let hill_start_y = Math.floor(HEIGHT / 3);
                let hill_end_y = HEIGHT;
                ctx.fillStyle = "rgb(240, 250, 255)";
                ctx.beginPath();
                ctx.moveTo(0, hill_start_y);
                ctx.lineTo(WIDTH, hill_end_y);
                ctx.lineTo(0, HEIGHT);
                ctx.closePath();
                ctx.fill();

                // 4. Update and draw rolling snowball locked to the hill slope
                menu_snowball.x += menu_snowball.vx;
                menu_snowball.angle += 0.05;
                menu_snowball.size += 0.05;

                let slope = (hill_end_y - hill_start_y) / WIDTH;
                menu_snowball.y = hill_start_y + (menu_snowball.x * slope) - (menu_snowball.size * 0.8);

                if (menu_snowball.x > WIDTH + 100) {
                    menu_snowball.x = -100;
                    menu_snowball.size = 20;
                }

                let sb_x = Math.trunc(menu_snowball.x);
                let sb_y = Math.trunc(menu_snowball.y);
                let sb_size = Math.trunc(menu_snowball.size);

                if (snow_sprite && display_mode === "TEXTURES") {
                    ctx.save();
                    ctx.translate(sb_x, sb_y);
                    ctx.rotate(menu_snowball.angle);
                    ctx.drawImage(snow_sprite, -sb_size, -sb_size, sb_size * 2, sb_size * 2);
                    ctx.restore();
                } else {
                    drawCircle(sb_x, sb_y, sb_size, WHITE);
                }
            }

            // 5. Translucent Layer (separates UI from bg)
            ctx.fillStyle = "rgba(0, 0, 0, 0.392)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // 6. Wintery white bubble letters (Title) with a more subtle pulse
            let title_pulse = Math.sin(get_ticks() * 0.0015);
            let title_size = Math.trunc(75 + (2 * title_pulse));
            let title_text = "SNOWBALL.IO";

            ctx.save();
            ctx.font = `bold ${title_size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            let t_x = WIDTH / 2;
            let t_y = HEIGHT / 4;

            // Draw thick light blue outline
            ctx.fillStyle = "rgb(150, 200, 255)";
            const offsets = [[-4,-4], [4,-4], [-4,4], [4,4], [-5,0], [5,0], [0,-5], [0,5]];
            for (let [dx, dy] of offsets) {
                ctx.fillText(title_text, t_x + dx, t_y + dy);
            }
            // Draw core text
            ctx.fillStyle = WHITE;
            ctx.fillText(title_text, t_x, t_y);
            ctx.restore();

            let play_btn = null;
            let offline_btn = null;
            let btn_y_offset = HEIGHT / 2 + 30;

            let btn_scale = 1.0 + (0.04 * Math.sin(get_ticks() * 0.002));
            let p_width = Math.trunc(280 * btn_scale);
            let p_height = Math.trunc(60 * btn_scale);
            let active_btn_font_size = Math.trunc(40 * btn_scale);

            // 7. Rounded UI Buttons
            if (server_status === "OK") {
                play_btn = makeRect(WIDTH / 2 - p_width / 2, btn_y_offset - p_height / 2, p_width, p_height);
                fillRoundRect(play_btn, "rgb(50, 150, 255)", 30);
                strokeRoundRect(play_btn, WHITE, 3, 30);

                ctx.save();
                ctx.font = `bold ${active_btn_font_size}px Arial`;
                ctx.fillStyle = WHITE;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("PLAY ONLINE", play_btn.centerx, play_btn.centery);
                ctx.restore();

                offline_btn = makeRect(WIDTH / 2 - 140, btn_y_offset + 80 - 30, 280, 60);
                fillRoundRect(offline_btn, "rgb(120, 130, 140)", 30);
                strokeRoundRect(offline_btn, WHITE, 3, 30);

                ctx.save();
                ctx.font = `20px Arial`;
                ctx.fillStyle = WHITE;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("OFFLINE MODE", offline_btn.centerx, offline_btn.centery);
                ctx.restore();
            } else {
                offline_btn = makeRect(WIDTH / 2 - p_width / 2, btn_y_offset - p_height / 2, p_width, p_height);
                let msg = server_status === "UNREACHABLE" ? "Server Unreachable" : "Monthly Bandwidth Capped";
                
                ctx.save();
                ctx.font = `bold 16px Arial`;
                ctx.fillStyle = "rgb(255, 100, 100)";
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(msg, WIDTH / 2, btn_y_offset - 45);
                ctx.restore();

                fillRoundRect(offline_btn, "rgb(120, 130, 140)", 30);
                strokeRoundRect(offline_btn, WHITE, 3, 30);

                ctx.save();
                ctx.font = `bold ${active_btn_font_size}px Arial`;
                ctx.fillStyle = WHITE;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("OFFLINE MODE", offline_btn.centerx, offline_btn.centery);
                ctx.restore();
            }

            return [play_btn, offline_btn];
        }

        function draw_connecting() {
            ctx.fillStyle = BG_COLOR_STR;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.save();
            ctx.font = "bold 40px Arial";
            ctx.fillStyle = BLACK;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText("Waking up server...", WIDTH / 2, HEIGHT / 2 - 20);

            ctx.font = "20px Arial";
            ctx.fillStyle = "rgb(100, 100, 100)";
            ctx.fillText("(This can take up to 50 seconds)", WIDTH / 2, HEIGHT / 2 + 30);
            ctx.restore();

            // Draw the Back Button
            fillRoundRect(BACK_BTN_RECT, "rgb(200, 50, 50)", 5);
            ctx.save();
            ctx.font = "bold 16px Arial";
            ctx.fillStyle = WHITE;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("BACK", BACK_BTN_RECT.centerx, BACK_BTN_RECT.centery);
            ctx.restore();
        }

        function draw_winner() {
            if (display_mode === "3D") renderer.render(scene, camera);
            ctx.fillStyle = "rgba(0, 0, 0, 0.588)";
            if (display_mode === "3D") ctx.clearRect(0, 0, WIDTH, HEIGHT);
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.save();
            ctx.font = "bold 40px Arial";
            ctx.fillStyle = WHITE;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText(winner_announcement, WIDTH / 2, HEIGHT / 2 - 20);
            ctx.restore();
        }

        function draw_game(move_active, move_angle, move_pos, aim_active, aim_angle, aim_pos, can_shoot, dt = 0.033) {
            if (!gamestate || Object.keys(gamestate).length === 0) {
                ctx.fillStyle = display_mode === "3D" ? "transparent" : BG_COLOR_STR;
                if (display_mode !== "3D") ctx.fillRect(0, 0, WIDTH, HEIGHT);
                else ctx.clearRect(0, 0, WIDTH, HEIGHT);
                
                ctx.save();
                ctx.font = "20px Arial";
                ctx.fillStyle = BLACK;
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText("Loading...", WIDTH / 2, HEIGHT / 2);
                ctx.restore();
                return;
            }
            
            if (display_mode === "3D") {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
            }

            // --- LERP (SMOOTHING) LOGIC ---
            let current_server_players = {};
            for (let p of (gamestate.players || [])) {
                if (p.alive) {
                    current_server_players[p.id] = p;
                }
            }

            // Remove disconnected or dead players from visual state
            let keys_to_remove = Object.keys(visual_players).filter(pid => !(pid in current_server_players));
            for (let pid of keys_to_remove) {
                if (capture_sound) {
                    capture_sound.play();
                }
                delete visual_players[pid];
            }

            // Frame-rate independent lerping using exponential decay formula
            let lerp_factor = 1.0 - Math.exp(-10.0 * dt);
            for (let [pid, sp] of Object.entries(current_server_players)) {
                if (!(pid in visual_players)) {
                    visual_players[pid] = {
                        x: sp.x,
                        y: sp.y,
                        angle: sp.angle,
                        size: sp.size,
                        aim_angle: sp.aim_angle || 0
                    };
                } else {
                    let vp = visual_players[pid];
                    vp.x += (sp.x - vp.x) * lerp_factor;
                    vp.y += (sp.y - vp.y) * lerp_factor;

                    let diff = pyMod(sp.angle - vp.angle + Math.PI, 2 * Math.PI) - Math.PI;
                    vp.angle += diff * lerp_factor;

                    let diff_aim = pyMod((sp.aim_angle || 0) - (vp.aim_angle || 0) + Math.PI, 2 * Math.PI) - Math.PI;
                    vp.aim_angle += diff_aim * lerp_factor;

                    vp.size = sp.size;

                    // --- PARTICLE TRAIL LOGIC ---
                    if (!vp.trail_particles) vp.trail_particles = [];

                    let is_moving = Math.abs(sp.x - vp.x) > 0.5 || Math.abs(sp.y - vp.y) > 0.5;
                    if (sp.alive && is_moving) {
                        let count = randInt(1, 2);
                        for (let i = 0; i < count; i++) {
                            let offset_x = randUniform(-vp.size * 0.4, vp.size * 0.4);
                            let offset_y = randUniform(-vp.size * 0.4, vp.size * 0.4);
                            let p_size = randUniform(2, 4);
                            vp.trail_particles.push([vp.x + offset_x, vp.y + offset_y, p_size, 30, 30]);
                        }
                    }

                    for (let i = vp.trail_particles.length - 1; i >= 0; i--) {
                        vp.trail_particles[i][3] -= 1;
                        if (vp.trail_particles[i][3] <= 0) {
                            vp.trail_particles.splice(i, 1);
                        }
                    }
                }
            }

            // Determine camera target using SMOOTHED coordinates
            let me = (gamestate.players || []).find(p => p.id === my_id) || null;
            target_x = 0;
            target_y = 0;
            let target_size = START_SIZE;
            let is_spectating = false;
            let spectated_name = "";

            if (me && me.alive && (my_id in visual_players)) {
                target_x = visual_players[my_id].x;
                target_y = visual_players[my_id].y;
                target_size = visual_players[my_id].size;
            } else if (gamestate.started) {
                let alive_players = (gamestate.players || []).filter(p => p.alive);
                if (alive_players.length > 0) {
                    let top_player = alive_players.reduce((maxP, currP) => currP.size > maxP.size ? currP : maxP, alive_players[0]);
                    if (top_player.id in visual_players) {
                        let vp_top = visual_players[top_player.id];
                        target_x = vp_top.x;
                        target_y = vp_top.y;
                        target_size = vp_top.size;
                    }
                    is_spectating = true;
                    spectated_name = top_player.name || "Unknown";
                }
            }

            const ZOOM_THRESHOLD = 80;
            zoom = 1.0;
            if (target_size > ZOOM_THRESHOLD) {
                zoom = ZOOM_THRESHOLD / target_size;
            }

            // --- RENDERING BRANCH ---
            if (display_mode === "DEFAULT" || display_mode === "TEXTURES") {
                // --- MOVING BACKGROUND LOGIC CONSOLIDATED ---
                if (bg_sprite && display_mode === "TEXTURES") {
                    let scaled_bg_w = Math.max(1, Math.trunc(bg_sprite.width * zoom));
                    let scaled_bg_h = Math.max(1, Math.trunc(bg_sprite.height * zoom));

                    let offset_x = pyMod(-Math.trunc(target_x * zoom), scaled_bg_w);
                    let offset_y = pyMod(-Math.trunc(target_y * zoom), scaled_bg_h);

                    for (let x = offset_x - scaled_bg_w; x < WIDTH; x += scaled_bg_w) {
                        for (let y = offset_y - scaled_bg_h; y < HEIGHT; y += scaled_bg_h) {
                            ctx.drawImage(bg_sprite, x, y, scaled_bg_w, scaled_bg_h);
                        }
                    }

                    ctx.fillStyle = `rgba(${BG_COLOR[0]}, ${BG_COLOR[1]}, ${BG_COLOR[2]}, ${120 / 255})`;
                    ctx.fillRect(0, 0, WIDTH, HEIGHT);
                } else {
                    ctx.fillStyle = BG_COLOR_STR;
                    ctx.fillRect(0, 0, WIDTH, HEIGHT);
                }

                function to_screen(world_x, world_y) {
                    let shake_x = screen_shake > 0 ? randUniform(-screen_shake, screen_shake) : 0;
                    let shake_y = screen_shake > 0 ? randUniform(-screen_shake, screen_shake) : 0;
                    return [
                        Math.trunc((world_x - target_x) * zoom + WIDTH / 2 + shake_x),
                        Math.trunc((world_y - target_y) * zoom + HEIGHT / 2 + shake_y)
                    ];
                }

                // Decay the screen shake over time
                if (screen_shake > 0) {
                    screen_shake = Math.max(0, screen_shake - 1.5);
                }

                let ring_r = gamestate.ring !== undefined ? gamestate.ring : 2000;
                let center_screen = to_screen(0, 0);
                strokeCircle(center_screen[0], center_screen[1], Math.max(1, Math.trunc(ring_r * zoom)), ORANGE, Math.max(1, Math.trunc(5 * zoom)));

                // Render Snow Particles
                let valid_particles = [];
                for (let p of (gamestate.particles || [])) {
                    let eaten = false;
                    for (let player of (gamestate.players || [])) {
                        if (player.alive && Math.hypot(player.x - p[0], player.y - p[1]) < player.size + p[2]) {
                            eaten = true;
                            if ((player.id === my_id || (app_state === "OFFLINE_GAME" && player.id === 0)) && collect_sound) {
                                let now_t = performance.now();
                                if (now_t - last_collect_time > 30) {
                                    collect_sound.play();
                                    last_collect_time = now_t;
                                }
                            }
                            break;
                        }
                    }
                    if (!eaten) {
                        valid_particles.push(p);
                        let [sx, sy] = to_screen(p[0], p[1]);
                        let scaled_p_size = Math.max(1, Math.trunc(p[2] * zoom));
                        if (snow_sprite && display_mode === "TEXTURES") {
                            ctx.drawImage(snow_sprite, sx - scaled_p_size, sy - scaled_p_size, scaled_p_size * 2, scaled_p_size * 2);
                        } else {
                            drawCircle(sx, sy, scaled_p_size, WHITE);
                        }
                    }
                }
                gamestate.particles = valid_particles;

                // Render Projectiles
                for (let p of (gamestate.projectiles || [])) {
                    let [sx, sy] = to_screen(p[0], p[1]);
                    let scaled_p_size = Math.max(1, Math.trunc(p[2] * zoom));
                    if (snow_sprite && display_mode === "TEXTURES") {
                        ctx.drawImage(snow_sprite, sx - scaled_p_size, sy - scaled_p_size, scaled_p_size * 2, scaled_p_size * 2);
                    } else {
                        drawCircle(sx, sy, scaled_p_size, WHITE);
                    }
                }

                // Render Players (Using smoothed visual data)
                let sorted_draw_players = [...(gamestate.players || [])].sort((a, b) => (a.id === my_id ? 1 : 0) - (b.id === my_id ? 1 : 0));
                for (let p of sorted_draw_players) {
                    if (!p.alive || !(p.id in visual_players)) continue;

                    let vp = visual_players[p.id];
                    let [sx, sy] = to_screen(vp.x, vp.y);
                    let scaled_size = Math.max(1, Math.trunc(vp.size * zoom));

                    // 1. DRAW FIXED 2.5D SHADOW FIRST
                    let shadow_w = Math.trunc(scaled_size * 1.8);
                    let shadow_h = Math.trunc(scaled_size * 0.8);
                    let shadow_x = sx;
                    let shadow_y = sy + Math.trunc(scaled_size * 0.75);

                    if (shadow_w > 0 && shadow_h > 0) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.ellipse(shadow_x, shadow_y, shadow_w / 2, shadow_h / 2, 0, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0, 0, 0, ${60 / 255})`;
                        ctx.fill();
                        ctx.restore();
                    }

                    // 2. DRAW FADING PARTICLE TRAIL SECOND
                    if (vp.trail_particles) {
                        for (let pt of vp.trail_particles) {
                            let [ptx, pty] = to_screen(pt[0], pt[1]);
                            let p_radius = Math.max(1, Math.trunc(pt[2] * zoom));
                            let alpha = Math.trunc((pt[3] / pt[4]) * 200) / 255;
                            drawCircle(ptx, pty, p_radius, `rgba(255, 255, 255, ${alpha})`);
                        }
                    }

                    // 3. DRAW THE ACTUAL BALL THIRD
                    if (snow_sprite && display_mode === "TEXTURES") {
                        ctx.drawImage(snow_sprite, sx - scaled_size, sy - scaled_size, scaled_size * 2, scaled_size * 2);
                    } else {
                        let color = p.id === my_id ? YELLOWISH_WHITE : "rgb(240, 240, 200)";
                        drawCircle(sx, sy, scaled_size, color);
                    }

                    if ((p.stun_timer || 0) > 0) {
                        let bar_w = 40;
                        ctx.fillStyle = RED;
                        ctx.fillRect(sx - bar_w / 2, sy - scaled_size - 25, bar_w, 6);
                        ctx.fillStyle = "rgb(255, 200, 0)";
                        ctx.fillRect(sx - bar_w / 2, sy - scaled_size - 25, bar_w * (p.stun_timer / 120), 6);
                    }

                    if (p.is_aiming && p.id === my_id) {
                        let cur_aim_angle = vp.aim_angle !== undefined ? vp.aim_angle : (p.aim_angle || 0);
                        let ray_length = 2000;
                        let end_x = Math.trunc(sx + Math.cos(cur_aim_angle) * ray_length);
                        let end_y = Math.trunc(sy + Math.sin(cur_aim_angle) * ray_length);

                        let p_size = vp.size;
                        let proj_size = (p_size + (p_size / 8)) / 4;
                        let ray_width = Math.max(2, Math.trunc((proj_size * 2) * zoom));

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(sx, sy);
                        ctx.lineTo(end_x, end_y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${80 / 255})`;
                        ctx.lineWidth = ray_width;
                        ctx.stroke();
                        ctx.restore();
                    }
                    if (display_mode === "DEFAULT" || display_mode === "TEXTURES") {
                        let angle = vp.angle;
                        let tip_x = sx + Math.cos(angle) * (scaled_size + 25 * zoom);
                        let tip_y = sy + Math.sin(angle) * (scaled_size + 25 * zoom);
                        let base_left_x = sx + Math.cos(angle - 0.5) * (scaled_size + 15 * zoom);
                        let base_left_y = sy + Math.sin(angle - 0.5) * (scaled_size + 15 * zoom);
                        let base_right_x = sx + Math.cos(angle + 0.5) * (scaled_size + 15 * zoom);
                        let base_right_y = sy + Math.sin(angle + 0.5) * (scaled_size + 15 * zoom);

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(tip_x, tip_y);
                        ctx.lineTo(base_left_x, base_left_y);
                        ctx.lineTo(base_right_x, base_right_y);
                        ctx.closePath();
                        ctx.fillStyle = BLACK;
                        ctx.fill();
                        ctx.restore();
                    }

                    let name_text = p.name || "Unknown";
                    ctx.save();
                    ctx.font = "bold 16px Arial";
                    ctx.fillStyle = BLACK;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(name_text, sx, sy - scaled_size - 15);
                    ctx.restore();
                }

                // --- OUT OF BOUNDS DIRECTIONAL ARROW ---
                if (me && me.alive && (my_id in visual_players) && (display_mode === "DEFAULT" || display_mode === "TEXTURES")) {
                    let vp = visual_players[my_id];
                    let ring_r = gamestate.ring !== undefined ? gamestate.ring : 2000;
                    if (Math.hypot(vp.x, vp.y) > ring_r) {
                        let angle_to_center = Math.atan2(-vp.y, -vp.x);
                        let [sx, sy] = to_screen(vp.x, vp.y);
                        let scaled_size = Math.max(1, Math.trunc(vp.size * zoom));

                        let pulse = (Math.sin(get_ticks() * 0.015) + 1) / 2;
                        let arrow_color = `rgb(255, ${Math.trunc(80 * pulse)}, ${Math.trunc(80 * pulse)})`;

                        let dist_tip = scaled_size + (50 * zoom);
                        let dist_base = scaled_size + (20 * zoom);

                        let tip_x = sx + Math.cos(angle_to_center) * dist_tip;
                        let tip_y = sy + Math.sin(angle_to_center) * dist_tip;
                        let base_l_x = sx + Math.cos(angle_to_center - 0.35) * dist_base;
                        let base_l_y = sy + Math.sin(angle_to_center - 0.35) * dist_base;
                        let base_r_x = sx + Math.cos(angle_to_center + 0.35) * dist_base;
                        let base_r_y = sy + Math.sin(angle_to_center + 0.35) * dist_base;

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(tip_x, tip_y);
                        ctx.lineTo(base_l_x, base_l_y);
                        ctx.lineTo(base_r_x, base_r_y);
                        ctx.closePath();
                        ctx.fillStyle = arrow_color;
                        ctx.fill();
                        ctx.lineWidth = Math.max(1, Math.trunc(2 * zoom));
                        ctx.strokeStyle = BLACK;
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            } else if (display_mode === "3D") {
                if (screen_shake > 0) screen_shake = Math.max(0, screen_shake - 1.5);
                let shakeX = screen_shake > 0 ? randUniform(-screen_shake, screen_shake) * 2 : 0;
                let shakeZ = screen_shake > 0 ? randUniform(-screen_shake, screen_shake) * 2 : 0;

                // --- THREE JS UPDATE ---
                let current_ring = gamestate.ring !== undefined ? gamestate.ring : 2000;
                ringMesh.scale.set(current_ring / 2000, current_ring / 2000, 1);

                let pCount = 0; let dummy = new THREE.Object3D();
                let valid_particles = [];
                for (let p of (gamestate.particles || [])) {
                    let eaten = false;
                    for (let player of (gamestate.players || [])) {
                        if (player.alive && Math.hypot(player.x - p[0], player.y - p[1]) < player.size + p[2]) {
                            eaten = true;
                            if ((player.id === my_id || (app_state === "OFFLINE_GAME" && player.id === 0)) && collect_sound) {
                                let now_t = performance.now();
                                if (now_t - last_collect_time > 30) { collect_sound.play(); last_collect_time = now_t; }
                            }
                            break;
                        }
                    }
                    if (!eaten) {
                        valid_particles.push(p);
                        dummy.position.set(p[0], p[2], p[1]); dummy.scale.set(p[2], p[2], p[2]); dummy.updateMatrix();
                        partInstanced.setMatrixAt(pCount++, dummy.matrix);
                    }
                }
                gamestate.particles = valid_particles;
                partInstanced.count = pCount; partInstanced.instanceMatrix.needsUpdate = true;

                let prCount = 0;
                for (let p of (gamestate.projectiles || [])) {
                    dummy.position.set(p[0], p[2], p[1]); dummy.scale.set(p[2], p[2], p[2]); dummy.updateMatrix();
                    projInstanced.setMatrixAt(prCount++, dummy.matrix);
                }
                projInstanced.count = prCount; projInstanced.instanceMatrix.needsUpdate = true;

                let sorted_draw_players = [...(gamestate.players || [])].sort((a, b) => (a.id === my_id ? 1 : 0) - (b.id === my_id ? 1 : 0));
                let current_ids = new Set();
                aimRayMesh.visible = false;
                
                for (let p of sorted_draw_players) {
                    if (!p.alive || !(p.id in visual_players)) continue;
                    current_ids.add(p.id); let vp = visual_players[p.id];
                    
                    if (!playerMeshes[p.id]) {
                        let group = new THREE.Group();
                        
                        let geo = new THREE.IcosahedronGeometry(1, 3);
                        let mat = new THREE.MeshLambertMaterial({
                            color: p.id === my_id ? 0xffffdc : 0xf0f0c8,
                            flatShading: true
                        });
                        let sphereMesh = new THREE.Mesh(geo, mat);
                        sphereMesh.castShadow = true; sphereMesh.receiveShadow = true;
                        group.add(sphereMesh);
                        
                        const dirGeo = new THREE.BufferGeometry();
                        const vertices = new Float32Array([1.8, 0.0, 0.0, 1.1, 0.0, 0.5, 1.1, 0.0, -0.5]);
                        dirGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                        dirGeo.computeVertexNormals();
                        const dirMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
                        const dirMesh = new THREE.Mesh(dirGeo, dirMat);
                        group.add(dirMesh);
                        
                        scene.add(group); playerMeshes[p.id] = group;
                    }
                    
                    let group = playerMeshes[p.id];
                    let sphere = group.children[0];
                    
                    group.position.set(vp.x, vp.size, vp.y);
                    group.scale.set(vp.size, vp.size, vp.size);
                    group.rotation.y = -vp.angle;
                    
                    let dx = vp.x - (vp.last_x !== undefined ? vp.last_x : vp.x);
                    let dy = vp.y - (vp.last_y !== undefined ? vp.last_y : vp.y);
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0.001) {
                        sphere.rotation.z -= (dist / vp.size);
                    }
                    vp.last_x = vp.x;
                    vp.last_y = vp.y;
                    
                    let screenPos = project3D(vp.x, vp.size * 2 + 10, vp.y);
                    if (screenPos) {
                        let [sx, sy] = screenPos;
                        if ((p.stun_timer || 0) > 0) {
                            let bar_w = 40; ctx.fillStyle = RED; ctx.fillRect(sx - bar_w / 2, sy - 25, bar_w, 6);
                            ctx.fillStyle = "rgb(255, 200, 0)"; ctx.fillRect(sx - bar_w / 2, sy - 25, bar_w * (p.stun_timer / 120), 6);
                        }
                        if (p.is_aiming && p.id === my_id) {
                            aimRayMesh.visible = true;
                            let cur_aim_angle = vp.aim_angle !== undefined ? vp.aim_angle : (p.aim_angle || 0);
                            
                            aimRayMesh.position.set(vp.x, 2, vp.y);
                            aimRayMesh.rotation.set(-Math.PI / 2, -cur_aim_angle, 0);
                            
                            let p_size = vp.size;
                            let proj_size = (p_size + (p_size / 8)) / 4;
                            aimRayMesh.scale.set(1500, proj_size * 2, 1);
                        }
                        let name_text = p.name || "Unknown";
                        ctx.save(); ctx.font = "bold 16px Arial"; ctx.fillStyle = BLACK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.fillText(name_text, sx, sy - 15); ctx.restore();
                    }
                }

                for (let id in playerMeshes) {
                    if (!current_ids.has(parseInt(id))) { scene.remove(playerMeshes[id]); delete playerMeshes[id]; }
                }

                let idealY = (target_size * 5.0) + 250;

                if (!gamestate.started && !is_spectating) {
                    let idealX = Math.cos(get_ticks() * 0.0005) * 1000; let idealZ = Math.sin(get_ticks() * 0.0005) * 1000; idealY = 1000;
                    target_x = 0; target_y = 0;
                    camera.position.x += (idealX - camera.position.x) * 0.1;
                    camera.position.z += (idealZ - camera.position.z) * 0.1;
                    camera.position.y += (idealY - camera.position.y) * 0.1;
                    camera.lookAt(target_x + shakeX, 0, target_y + shakeZ);
                } else {
                    camera.position.x = target_x;
                    camera.position.z = target_y + (target_size * 3.5) + 80;
                    camera.position.y += (idealY - camera.position.y) * 0.1;
                    camera.lookAt(target_x + shakeX, 0, target_y + shakeZ);
                }
                
                scene.fog.near = idealY * 0.8;
                scene.fog.far = idealY * 2.2;
                
                renderer.render(scene, camera);

                if (me && me.alive && visual_players[my_id]) {
                    let vp = visual_players[my_id]; let ring_r = gamestate.ring !== undefined ? gamestate.ring : 2000;
                    if (Math.hypot(vp.x, vp.y) > ring_r) {
                        let angle_to_center = Math.atan2(-vp.y, -vp.x);
                        let screenPos = project3D(vp.x, vp.size, vp.y);
                        if (screenPos) {
                            let [sx, sy] = screenPos; let pulse = (Math.sin(get_ticks() * 0.015) + 1) / 2;
                            let arrow_color = `rgb(255, ${Math.trunc(80 * pulse)}, ${Math.trunc(80 * pulse)})`;
                            let dist_tip = vp.size + 50; let dist_base = vp.size + 20;
                            let tip_x = sx + Math.cos(angle_to_center) * dist_tip; let tip_y = sy + Math.sin(angle_to_center) * dist_tip;
                            let base_l_x = sx + Math.cos(angle_to_center - 0.35) * dist_base; let base_l_y = sy + Math.sin(angle_to_center - 0.35) * dist_base;
                            let base_r_x = sx + Math.cos(angle_to_center + 0.35) * dist_base; let base_r_y = sy + Math.sin(angle_to_center + 0.35) * dist_base;
                            ctx.save(); ctx.beginPath(); ctx.moveTo(tip_x, tip_y); ctx.lineTo(base_l_x, base_l_y); ctx.lineTo(base_r_x, base_r_y); ctx.closePath();
                            ctx.fillStyle = arrow_color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = BLACK; ctx.stroke(); ctx.restore();
                        }
                    }
                }
            }
            
            if (is_spectating) {
                ctx.save();
                ctx.font = "bold 40px Arial";
                ctx.fillStyle = RED;
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(`SPECTATING: ${spectated_name}`, WIDTH / 2, HEIGHT - 60);
                ctx.restore();
            }

            if (!gamestate.started) {
                ctx.fillStyle = `rgba(0, 0, 0, ${150 / 255})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                let human_players = (gamestate.players || []).filter(p => !p.is_bot);

                ctx.save();
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = WHITE;
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillText(`LOBBY (${human_players.length}/10):`, 15, 15);
                for (let i = 0; i < human_players.length; i++) {
                    let p = human_players[i];
                    ctx.fillText(`- ${p.name || 'Unknown'}`, 15, 40 + i * 25);
                }
                ctx.restore();

                if (human_players.length >= 2) {
                    let lobby_time = gamestate.lobby_time !== undefined ? gamestate.lobby_time : 60;
                    ctx.save();
                    ctx.font = "bold 40px Arial";
                    ctx.fillStyle = WHITE;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "top";
                    ctx.fillText(`Starts in: ${lobby_time}s`, WIDTH / 2, HEIGHT / 2 - 100);
                    ctx.restore();

                    let status = (me && me.ready) ? "READY" : "NOT READY";
                    let btn_color = status === "READY" ? "rgb(40, 180, 40)" : "rgb(220, 50, 50)";
                    let btn_rect = makeRect(WIDTH / 2 - 110, HEIGHT / 2 - 30, 220, 60);

                    fillRoundRect(btn_rect, btn_color, 10);
                    strokeRoundRect(btn_rect, WHITE, 2, 10);

                    ctx.save();
                    ctx.font = "20px Arial";
                    ctx.fillStyle = WHITE;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(`Status: ${status}`, btn_rect.centerx, btn_rect.centery);
                    ctx.restore();
                } else {
                    ctx.save();
                    ctx.font = "bold 40px Arial";
                    ctx.fillStyle = WHITE;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "top";
                    ctx.fillText("Waiting for 2+ players...", WIDTH / 2, HEIGHT / 2 - 30);
                    ctx.restore();
                }
            }

            if (gamestate.started) {
                let sorted_players = [...(gamestate.players || [])].sort((a, b) => b.size - a.size);
                let y_offset = 15;
                let current_rank = 1;
                let previous_size = null;

                ctx.save();
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = BLACK;
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillText("LEADERBOARD", 15, y_offset);
                y_offset += 25;

                for (let i = 0; i < sorted_players.length; i++) {
                    let p = sorted_players[i];
                    if (previous_size !== null && p.size < previous_size) {
                        current_rank = i + 1;
                    }
                    previous_size = p.size;

                    let text_color = p.id === my_id ? RED : BLACK;
                    let status_marker = p.alive ? "" : " (DEAD)";
                    let entry_text = `${current_rank}. ${p.name || 'Unknown'} - ${Math.trunc(p.size)}${status_marker}`;

                    let txt_width = ctx.measureText(entry_text).width;
                    ctx.fillStyle = `rgba(255, 255, 255, ${180 / 255})`;
                    
                    // Increased box height to 22px for comfortable padding
                    ctx.fillRect(10, y_offset - 3, txt_width + 10, 22);

                    ctx.fillStyle = text_color;
                    ctx.fillText(entry_text, 15, y_offset);
                    
                    // Restored the original 22px spacing so the boxes stack seamlessly
                    y_offset += 22;
                }
                ctx.restore();

                // --- MATCH COUNTDOWN TIMER ---
                let current_ring_size = gamestate.ring || 0;
                let time_left = Math.max(0, Math.trunc(current_ring_size / (RING_SHRINK_RATE * FPS)));
                let mins = Math.floor(time_left / 60);
                let secs = time_left % 60;
                let timer_str = `${mins}:${secs < 10 ? '0' + secs : secs}`;

                ctx.save();
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                if (time_left > 0) {
                    ctx.fillStyle = BLACK;
                    ctx.fillText(timer_str, WIDTH / 2 + 2, 22);
                    ctx.fillStyle = WHITE;
                    ctx.fillText(timer_str, WIDTH / 2, 20);
                } else {
                    if (Math.floor(get_ticks() / 400) % 2 === 0) {
                        ctx.fillStyle = BLACK;
                        ctx.fillText(timer_str, WIDTH / 2 + 2, 22);
                        ctx.fillStyle = RED;
                        ctx.fillText(timer_str, WIDTH / 2, 20);
                    }
                }
                ctx.restore();
            }

            // Draw Display Mode Toggle Button
            // Slightly wider to fit text
            fillRoundRect(MODE_BTN_RECT, "rgb(70, 70, 70)", 5);
            strokeRoundRect(MODE_BTN_RECT, "rgb(200, 200, 200)", 2, 5);
            let btn_text = "Mode: ";
            if (display_mode === "DEFAULT") btn_text += "Default";
            else if (display_mode === "TEXTURES") btn_text += "Textures";
            else if (display_mode === "3D") btn_text += "3D";
            
            ctx.save();
            ctx.font = "bold 16px Arial";
            ctx.fillStyle = WHITE;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(btn_text, MODE_BTN_RECT.centerx, MODE_BTN_RECT.centery);
            ctx.restore();

            if (app_state === "OFFLINE_GAME" || (app_state === "GAME" && !gamestate.started)) {
                fillRoundRect(BACK_BTN_RECT, "rgb(200, 50, 50)", 5);
                ctx.save();
                ctx.font = "bold 16px Arial";
                ctx.fillStyle = WHITE;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("BACK", BACK_BTN_RECT.centerx, BACK_BTN_RECT.centery);
                ctx.restore();
            }

            if (me && me.alive && gamestate.started) {
                const KNOB_RADIUS = 25;

                // Draw Left Joystick (Movement)
                drawCircle(MOVE_JOY_CENTER[0], MOVE_JOY_CENTER[1], JOY_RADIUS, `rgba(0, 0, 0, ${80 / 255})`);
                let kx, ky;
                if (move_active) {
                    let dist = Math.hypot(move_pos[0] - MOVE_JOY_CENTER[0], move_pos[1] - MOVE_JOY_CENTER[1]);
                    dist = Math.min(dist, JOY_RADIUS);
                    kx = MOVE_JOY_CENTER[0] + Math.cos(move_angle) * dist;
                    ky = MOVE_JOY_CENTER[1] + Math.sin(move_angle) * dist;
                } else {
                    kx = MOVE_JOY_CENTER[0];
                    ky = MOVE_JOY_CENTER[1];
                }
                drawCircle(Math.trunc(kx), Math.trunc(ky), KNOB_RADIUS, `rgba(255, 255, 255, ${150 / 255})`);

                // Draw Right Joystick (Aim/Shoot)
                if (can_shoot) {
                    drawCircle(AIM_JOY_CENTER[0], AIM_JOY_CENTER[1], JOY_RADIUS, `rgba(0, 0, 0, ${80 / 255})`);
                    let akx, aky;
                    if (aim_active) {
                        let dist = Math.hypot(aim_pos[0] - AIM_JOY_CENTER[0], aim_pos[1] - AIM_JOY_CENTER[1]);
                        dist = Math.min(dist, JOY_RADIUS);
                        akx = AIM_JOY_CENTER[0] + Math.cos(aim_angle) * dist;
                        aky = AIM_JOY_CENTER[1] + Math.sin(aim_angle) * dist;
                    } else {
                        akx = AIM_JOY_CENTER[0];
                        aky = AIM_JOY_CENTER[1];
                    }
                    drawCircle(Math.trunc(akx), Math.trunc(aky), KNOB_RADIUS, `rgba(255, 255, 255, ${150 / 255})`);

                    ctx.save();
                    ctx.strokeStyle = `rgba(0, 0, 0, ${150 / 255})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(Math.trunc(akx) - 10, Math.trunc(aky));
                    ctx.lineTo(Math.trunc(akx) + 10, Math.trunc(aky));
                    ctx.moveTo(Math.trunc(akx), Math.trunc(aky) - 10);
                    ctx.lineTo(Math.trunc(akx), Math.trunc(aky) + 10);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // ==============================================================================
        // INPUT & EVENT HANDLING
        // ==============================================================================
        let event_queue = [];
        let active_touches = {};
        let mouse_active = false;
        let mouse_start = [0, 0];
        let mouse_pos = [0, 0];
        let mouse_buttons = [false, false, false];
        let mouse_focused = true;
        let keys_pressed = {};

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return [
                (clientX - rect.left) * (WIDTH / rect.width),
                (clientY - rect.top) * (HEIGHT / rect.height)
            ];
        }

        canvas.addEventListener("mousedown", (e) => {
            let pos = getCanvasCoords(e.clientX, e.clientY);
            mouse_pos = pos;
            if (e.button === 0) {
                mouse_buttons[0] = true;
                event_queue.push({ type: "MOUSEBUTTONDOWN", button: 1, pos: pos });
            } else if (e.button === 2) {
                mouse_buttons[2] = true;
            }
        });

        window.addEventListener("mousemove", (e) => {
            mouse_pos = getCanvasCoords(e.clientX, e.clientY);
        });

        window.addEventListener("mouseup", (e) => {
            let pos = getCanvasCoords(e.clientX, e.clientY);
            mouse_pos = pos;
            if (e.button === 0) {
                mouse_buttons[0] = false;
                event_queue.push({ type: "MOUSEBUTTONUP", button: 1, pos: pos });
            } else if (e.button === 2) {
                mouse_buttons[2] = false;
            }
        });

        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        canvas.addEventListener("mouseenter", () => { mouse_focused = true; });
        canvas.addEventListener("mouseleave", () => { mouse_focused = false; });

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                let nx = (t.clientX - rect.left) / rect.width;
                let ny = (t.clientY - rect.top) / rect.height;
                event_queue.push({ type: "FINGERDOWN", finger_id: t.identifier, x: nx, y: ny });
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                let nx = (t.clientX - rect.left) / rect.width;
                let ny = (t.clientY - rect.top) / rect.height;
                event_queue.push({ type: "FINGERMOTION", finger_id: t.identifier, x: nx, y: ny });
            }
        }, { passive: false });

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                event_queue.push({ type: "FINGERUP", finger_id: t.identifier });
            }
        }
        canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
        canvas.addEventListener("touchcancel", handleTouchEnd, { passive: false });

        window.addEventListener("keydown", (e) => {
            keys_pressed[e.code] = true;
            if (e.code === "Space") {
                event_queue.push({ type: "KEYDOWN", key: "K_SPACE" });
            }
        });

        window.addEventListener("keyup", (e) => {
            keys_pressed[e.code] = false;
        });

        // ==============================================================================
        // MAIN LOOP
        // ==============================================================================
        function main() {
            let last_angle = 0;
            let last_moving = false;
            let last_aim_angle = 0;
            let last_is_aiming = false;
            let last_shoot_time = 0;
            let pending_shoot_command = false;

            let current_music_state = null;
            let last_projectile_count = 0;
            let last_projectiles = [];
            let last_alive_players = {};
            let recent_hits = {};
            let last_out_of_bounds = new Set();

            let last_frame_time = performance.now();

            function step(current_time) {
                let raw_ms = current_time - last_frame_time;
                let dt = raw_ms / 1000.0;
                last_frame_time = current_time;

                let now = get_ticks();
